# Mosquitto MQTT broker configuration for dev
# Docker mounts this at /mosquitto/config/mosquitto.conf

listener 1883 0.0.0.0
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data

# Logging
log_dest stdout
log_type all

# Security note: in production, add password auth:
#   password_file /mosquitto/config/passwd
#   allow_anonymous false
