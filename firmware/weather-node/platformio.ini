# Weather Station — Arduino Framework Build Settings
#
# This is a companion file for VS Code Intellisense when PlatformIO
# extension is installed. Also used by Arduino CLI for ESP32.

[env:wroom32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit BMP280 Library@^2.6
    milesburton/DallasTemperature@^3.11
    paulstoffregen/OneWire@^2.3

[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partitions_16mb.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2
    adafruit/Adafruit BMP280 Library@^2.6
    milesburton/DallasTemperature@^3.11
    paulstoffregen/OneWire@^2.3
    bblanchon/ArduinoJson@^7
    fastled/FastLED@^3.9
    adafruit/Adafruit NeoPixel@^1.12
    4-20ma/ModbusMaster@^2.0.1
