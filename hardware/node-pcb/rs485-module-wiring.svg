<text x="790" y="448" font-size="13">NC</text>
<text x="45" y="524" font-size="16">C7: 100nF across module VCC/GND. Old R8/R9 receive divider removed.</text>
<text x="45" y="554" font-size="16">R10: 120Ω across A/B, DNP by default. Fit only at a bus end without existing termination.</text>
<text x="45" y="584" font-size="16">Earth terminal remains separate from TTL GND; final grounding requires module documentation.</text>
<text x="45" y="614" font-size="16">If labels use the host convention: GPIO17 → TXD input; GPIO18 ← RXD output.</text>
<text x="45" y="650" font-size="13" fill="#64748b">Revision 2026-09-29 · Functional wiring reference; not a verified physical PCB footprint.</text>
