<text x="58" y="138" font-size="16" font-weight="bold">PROVISIONAL UART MAPPING — verify TXD/RXD input/output directions before wiring.</text>
<text x="58" y="161" font-size="15">The photo confirms terminal names, but not signal directions. Crossed UART wiring is assumed below.</text>
